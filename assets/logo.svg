<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="violetnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="120" fill="#0d1117" rx="10"/>
  <!-- Neural Topology Vector Glyph -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="70" height="70" fill="none" stroke="url(#violetnet)" stroke-width="2" rx="8"/>
    <!-- Synaptic edges -->
    <line x1="20" y1="23" x2="35" y2="17" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="20" y1="23" x2="35" y2="35" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="20" y1="47" x2="35" y2="35" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="20" y1="47" x2="35" y2="53" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="35" y1="17" x2="50" y2="35" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="35" y1="35" x2="50" y2="35" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="35" y1="53" x2="50" y2="35" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Input layer nodes -->
    <circle cx="20" cy="23" r="4" fill="#a78bfa"/>
    <circle cx="20" cy="47" r="4" fill="#a78bfa"/>
    <!-- Hidden layer nodes -->
    <circle cx="35" cy="17" r="4" fill="#818cf8"/>
    <circle cx="35" cy="35" r="4" fill="#c084fc"/>
    <circle cx="35" cy="53" r="4" fill="#818cf8"/>
    <!-- Output layer node -->
    <circle cx="50" cy="35" r="5" fill="#38bdf8"/>
  </g>
  <!-- Typography -->
  <text x="125" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">LEARNING-DL</text>
  <text x="127" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.5">NEURAL ARCHITECTURES AND DEEP LEARNING FROM SCRATCH</text>
  <line x1="125" y1="92" x2="570" y2="92" stroke="#21262d" stroke-width="1.5"/>
</svg>
